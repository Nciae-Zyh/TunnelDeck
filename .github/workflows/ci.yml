name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            extension/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Type-check and build frontend
        run: npm run build
        working-directory: frontend

      - name: Build and validate Chrome Web Store package
        run: ./scripts/package-chrome-extension.sh

      - name: Scan Git history for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner .

      - name: Run Go tests with race detector
        run: go test -race ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Verify Native Messaging installer
        run: |
          sh -n \
            install.sh \
            scripts/install-from-source.sh \
            scripts/install-native-host.sh \
            scripts/package-chrome-extension.sh \
            scripts/uninstall-native-host.sh
          ./install.sh --check
          test_dir=$(mktemp -d)
          go build -o "$test_dir/TunnelDeck" .
          TUNNELDECK_NATIVE_HOST_DIR="$test_dir/manifests" \
            ./scripts/install-native-host.sh \
            --extension-id aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --binary "$test_dir/TunnelDeck"
          jq -e \
            '.name == "com.tunneldeck.native" and
             .allowed_origins == ["chrome-extension://aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/"]' \
            "$test_dir/manifests/com.tunneldeck.native.json"
          TUNNELDECK_NATIVE_HOST_DIR="$test_dir/manifests" \
            ./scripts/uninstall-native-host.sh

      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
        working-directory: frontend

      - name: Audit extension dependencies
        run: npm audit --audit-level=high
        working-directory: extension

  build:
    name: Build check (${{ matrix.platform }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-amd64
          - os: windows-2025
            platform: windows-amd64
          - os: macos-15
            platform: macos-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate Windows source installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($script in @('install.ps1', 'scripts/install-from-source.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) { throw "$script`n$($errors | Out-String)" }
          }

      - name: Build macOS application
        if: runner.os == 'macOS'
        run: wails build -clean

      - name: Build Windows application
        if: runner.os == 'Windows'
        run: wails build -clean

      - name: Build Linux application
        if: runner.os == 'Linux'
        run: wails build -clean -tags webkit2_41
