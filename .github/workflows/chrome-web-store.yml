name: Chrome Web Store package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: chrome-web-store-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build review-ready ZIP
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go for security scan
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Scan repository for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner .

      - name: Build Chrome Web Store ZIP
        run: ./scripts/package-chrome-extension.sh

      - name: Inspect package contents
        run: |
          archive=$(find artifacts/chrome-web-store -maxdepth 1 -name '*.zip' -print -quit)
          test -n "$archive"
          unzip -t "$archive"
          unzip -Z1 "$archive" | sort

      - name: Upload review-ready ZIP
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: TunnelDeck-chrome-web-store
          path: artifacts/chrome-web-store/*.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to Chrome Web Store
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: chrome-web-store-production
    permissions:
      contents: read
      id-token: write
    env:
      CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
      CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
      CWS_PUBLISH_TYPE: DEFAULT_PUBLISH
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Chrome Web Store package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: TunnelDeck-chrome-web-store
          path: artifacts/chrome-web-store

      - name: Validate release metadata
        shell: bash
        run: |
          test -n "${{ vars.GCP_WIF_PROVIDER }}"
          test -n "${{ vars.GCP_SERVICE_ACCOUNT }}"
          test -n "$CWS_EXTENSION_ID"
          test -n "$CWS_PUBLISHER_ID"
          archive=$(find artifacts/chrome-web-store -maxdepth 1 -name '*.zip' -print -quit)
          test -n "$archive"
          manifest_version=$(unzip -p "$archive" manifest.json | jq -er '.version')
          test "v$manifest_version" = "$GITHUB_REF_NAME"

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Upload and submit for review
        shell: bash
        env:
          CWS_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: |
          archive=$(find artifacts/chrome-web-store -maxdepth 1 -name '*.zip' -print -quit)
          ./scripts/publish-chrome-web-store.sh "$archive"
